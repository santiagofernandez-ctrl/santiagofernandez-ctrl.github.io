<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zombie World Explorer</title>
<style>
:root{--bg:#10140f;--fg:#d9e0cf;--ac:#d9894f;--dim:#8a9484;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{color-scheme:dark}}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,"Times New Roman",serif;overflow:hidden}
canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none;font-size:14px}
#prompt{position:absolute;left:50%;top:58%;transform:translateX(-50%);padding:6px 12px;background:#0009;border-left:3px solid var(--ac);display:none}
#dot{position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px;background:var(--fg);border-radius:50%;opacity:.6}
#stats{position:absolute;left:12px;bottom:12px;color:var(--dim);font-size:12px;line-height:1.5;white-space:pre}
#toast{position:absolute;left:50%;top:14%;transform:translateX(-50%);opacity:0;transition:opacity .3s}
 
:root{--dawn:#d9894f;--bone:#e6dfcd;--night:#0f1311;--mist:#8d9585}
[hidden]{display:none!important}
body:not([data-s=play]) #hud{display:none}
#ui{position:fixed;inset:0;z-index:5;animation:in .22s both;transition:opacity .18s}
#ui.out{opacity:0;pointer-events:none}
#ui.dim{background:#0f1311b8}
#bg{position:absolute;inset:0;background:var(--night);overflow:hidden;display:none}
#ui.bgon #bg{display:block}
#bg svg{position:absolute;inset:0;width:100%;height:100%}
#bg::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#0f1311d9,#0f131100 62%),linear-gradient(0deg,#0f1311cc,#0f131100 40%)}
.fog{position:absolute;left:0;width:200%;background-repeat:repeat-x;background-size:50% 100%;animation:drift 90s linear infinite;will-change:transform}
.f1{bottom:16%;height:34%;background-image:radial-gradient(ellipse at 30% 60%,#d8c8aa55,transparent 62%),radial-gradient(ellipse at 80% 40%,#b9c0b044,transparent 55%)}
.f2{bottom:0;height:30%;animation-duration:140s;animation-direction:reverse;background-image:radial-gradient(ellipse at 50% 70%,#8d968a55,transparent 65%)}
@keyframes drift{to{transform:translateX(-50%)}}
@keyframes in{from{opacity:0}}
#scr{position:absolute;inset:0;z-index:1}
.scr{height:100%;box-sizing:border-box;font-family:"Segoe UI",system-ui,sans-serif;color:var(--bone)}
.main{display:flex;flex-direction:column;justify-content:center;padding:4vh 8vw;gap:4vh}
.main h1{margin:0;display:flex;flex-direction:column;font:800 clamp(44px,10.5vw,124px)/.88 "Bahnschrift","Arial Narrow","Franklin Gothic Medium",Impact,sans-serif;text-transform:uppercase;letter-spacing:.03em}
.main h1 span:nth-child(2){padding-left:.9em;color:transparent;-webkit-text-stroke:2px var(--bone)}
.tag{margin:14px 0 0;color:var(--dawn);font-size:clamp(14px,2vw,18px);letter-spacing:.18em;text-transform:uppercase}
.main nav,.stack{display:flex;flex-direction:column;align-items:flex-start}
.btn{background:none;border:0;border-left:3px solid transparent;color:var(--bone);font:600 clamp(16px,2.4vw,22px)/1 "Segoe UI",system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;text-align:left;padding:11px 18px;margin:2px 0;cursor:pointer;transition:transform .15s,border-color .15s,background .15s}
.btn:hover,.btn:focus-visible{border-color:var(--dawn);background:#e6dfcd14;transform:translateX(8px)}
.btn:focus-visible{outline:2px solid var(--bone)}
.btn:disabled{opacity:.35;cursor:default}
.btn.warn{color:var(--dawn)}
.btn small{display:block;margin-top:6px;font-weight:400;letter-spacing:.04em;text-transform:none;color:var(--mist);font-size:12px}
.main footer{color:var(--mist);font-size:12px;position:absolute;right:20px;bottom:14px}
.panel{width:min(600px,92vw);max-height:88vh;overflow:auto;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);height:auto;padding:26px 30px;background:#0f1311ee;border-left:3px solid var(--dawn)}
.panel h2{margin:0 0 14px;font:800 30px "Bahnschrift","Arial Narrow",Impact,sans-serif;text-transform:uppercase;letter-spacing:.06em}
.tabs{display:flex;gap:4px;border-bottom:1px solid #e6dfcd33;margin-bottom:10px}
.tabs button{background:none;border:0;color:var(--mist);padding:8px 14px;font:inherit;cursor:pointer;border-bottom:2px solid transparent}
.tabs .on{color:var(--bone);border-color:var(--dawn)}
.row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:1px solid #e6dfcd14;font-size:15px}
.ctl{display:flex;align-items:center;gap:10px}.ctl input[type=range]{width:170px;accent-color:var(--dawn)}.ctl output{min-width:58px;text-align:right;color:var(--mist)}
.seg button{background:none;border:1px solid #e6dfcd44;color:var(--bone);padding:6px 10px;cursor:pointer;font:inherit;text-transform:capitalize}.seg .on{background:var(--dawn);color:var(--night);border-color:var(--dawn)}
kbd{font:600 13px ui-monospace,monospace;border:1px solid #e6dfcd55;padding:3px 9px}
.note{color:var(--mist);font-size:12px;margin:10px 0 0;line-height:1.5}
.foot{display:flex;justify-content:space-between;margin-top:14px}
.panel .btn{font-size:15px}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:9;transition:opacity .35s}
#fade.on{opacity:1;pointer-events:all}
@media (prefers-reduced-motion:reduce){.fog{animation:none}#ui,#fade{transition:none;animation:none}}
 
</style></head><body>
<div id="hud"><div id="dot"></div><div id="prompt"></div><div id="toast"></div><div id="stats"></div></div>
<div id="ui" hidden><div id="bg"></div><div id="scr"></div></div><div id="fade"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
const CS=64,INT_R=20;let LOAD=3,UNLOAD=4,TREES=70;
// ---------- util / mundo (datos puros, deterministas) ----------
let SEED=0x9e3779b9,OX=0,OZ=0;const rngOf=(a,b)=>{let s=(a*73856093^b*19349663^SEED)>>>0;return()=>{s=(s+0x6D2B79F5)>>>0;let t=s;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}};
const H=(x,z)=>{x+=OX;z+=OZ;return Math.sin(x*.011)*6+Math.cos(z*.013)*5+Math.sin((x+z)*.031)*2};
const roadD=z=>Math.abs((((z%128)+128)%128)-64);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const saved=new Map(); // estado persistente de objetos por chunk (sobrevive a la descarga)
// ---------- render ----------
const R=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});
R.setPixelRatio(Math.min(devicePixelRatio,1.5));R.setSize(innerWidth,innerHeight);document.body.prepend(R.domElement);
const S=new THREE.Scene(),SKY=0x8d9a90;S.background=new THREE.Color(SKY);S.fog=new THREE.FogExp2(SKY,.011);
const cam=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,320);
S.add(new THREE.HemisphereLight(0xbfcab8,0x3a3a30,.9));
const sun=new THREE.DirectionalLight(0xfff0d0,.7);sun.position.set(60,100,40);S.add(sun);
addEventListener('resize',()=>{R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()});
// recursos compartidos (una sola geometría/material por tipo)
const BOX=new THREE.BoxGeometry(1,1,1),CONE=new THREE.ConeGeometry(1.6,5,6),TRUNK=new THREE.CylinderGeometry(.18,.28,2.2,5);
const wallMats=[0x8a8578,0x7b6f60,0x6d7a78,0x8c7a6a].map(c=>new THREE.MeshLambertMaterial({color:c}));
const roofMat=new THREE.MeshLambertMaterial({color:0x4a3b36}),doorMat=new THREE.MeshLambertMaterial({color:0x5a4030});
const floorMat=new THREE.MeshLambertMaterial({color:0x3b342c}),crateMat=new THREE.MeshLambertMaterial({color:0x7a5a2e}),groundMat=new THREE.MeshLambertMaterial({vertexColors:true});
const crownMat=new THREE.MeshLambertMaterial({color:0xffffff}),trunkMat=new THREE.MeshLambertMaterial({color:0x4a3626});
const box=(m,x,y,z,w,h,d,p)=>{const o=new THREE.Mesh(BOX,m);o.position.set(x,y,z);o.scale.set(w,h,d);(p||S).add(o);return o};
// ---------- chunks ----------
const chunks=new Map();
function buildChunk(cx,cz){
  const key=cx+','+cz,rnd=rngOf(cx,cz),g=new THREE.Group(),ch={key,cx,cz,g,walls:[],inter:[],blds:[],disp:[]};
  // terreno + carretera por color de vértice
  const geo=new THREE.PlaneGeometry(CS,CS,24,24);geo.rotateX(-Math.PI/2);
  const p=geo.attributes.position,col=new Float32Array(p.count*3),c=new THREE.Color();
  for(let i=0;i<p.count;i++){const x=p.getX(i)+cx*CS+CS/2,z=p.getZ(i)+cz*CS+CS/2,y=H(x,z);p.setXYZ(i,x,y,z);
    const n=Math.sin(x*.21)*Math.cos(z*.17);
    if(roadD(z)<3.5)c.setRGB(.2,.2,.21);else c.setHSL(.24-.03*n+(y>6?-.08:0),.3,.2+.04*n+Math.max(0,y)*.006);
    col.set([c.r,c.g,c.b],i*3)}
  geo.setAttribute('color',new THREE.BufferAttribute(col,3));geo.computeVertexNormals();
  g.add(new THREE.Mesh(geo,groundMat));ch.disp.push(geo);
  // edificios con variación de tamaño, material, daño
  const nb=Math.floor(rnd()*3),ox=cx*CS,oz=cz*CS;
  for(let i=0;i<nb;i++){
    const w=7+rnd()*6,d=6+rnd()*5,x=ox+12+rnd()*(CS-24),z=oz+12+rnd()*(CS-24);
    if(roadD(z)<d/2+8)continue;
    const b={i,x,z,w,d,y:H(x,z),h:3.2,mat:wallMats[Math.floor(rnd()*4)],door:null,open:false,interior:null,crate:false,lean:(rnd()-.5)*.12};
    const st=saved.get(key+'/'+i);if(st){b.open=st.open;b.crate=st.crate}
    ch.blds.push(b);bldWalls(ch,b,g)}
  // árboles instanciados (1 draw call por parte) con exclusión de edificios/carretera
  const N=TREES,tc=new THREE.InstancedMesh(CONE,crownMat,N),tt=new THREE.InstancedMesh(TRUNK,trunkMat,N),m=new THREE.Matrix4(),q=new THREE.Quaternion(),col2=new THREE.Color();let n=0;
  for(let k=0;k<N;k++){const x=ox+rnd()*CS,z=oz+rnd()*CS,s=.7+rnd()*.9;
    if(roadD(z)<6||ch.blds.some(b=>Math.abs(x-b.x)<b.w/2+4&&Math.abs(z-b.z)<b.d/2+4))continue;
    const y=H(x,z);m.compose(new THREE.Vector3(x,y+1.1*s,z),q,new THREE.Vector3(s,s,s));tt.setMatrixAt(n,m);
    m.compose(new THREE.Vector3(x,y+(2.2+2.5)*s,z),q,new THREE.Vector3(s,s,s));tc.setMatrixAt(n,m);
    tc.setColorAt(n,col2.setHSL(.27+rnd()*.06,.35,.14+rnd()*.08));n++}
  tc.count=tt.count=n;tc.instanceColor&&(tc.instanceColor.needsUpdate=true);g.add(tc,tt);ch.disp.push(tc,tt);
  S.add(g);chunks.set(key,ch)}
function bldWalls(ch,b,g){
  const {x,z,w,d,y,h}=b,t=.4,by=y-1+(h+1)/2,gap=1.8,sw=(w-gap)/2;
  const add=(wx,wz,ww,wd)=>{box(b.mat,wx,by,wz,ww,h+1,wd,g);ch.walls.push({x0:wx-ww/2,x1:wx+ww/2,z0:wz-wd/2,z1:wz+wd/2,y:y+h})};
  add(x,z-d/2,w,t);add(x-w/2,z,t,d);add(x+w/2,z,t,d);
  add(x-gap/2-sw/2,z+d/2,sw,t);add(x+gap/2+sw/2,z+d/2,sw,t);
  const r=box(roofMat,x,y+h+.2,z,w+.8,.4,d+.8,g);r.rotation.z=b.lean;
  // puerta (pivote en la bisagra) + colisión mientras esté cerrada
  const piv=new THREE.Group();piv.position.set(x-gap/2,y,z+d/2);g.add(piv);
  const dm=box(doorMat,gap/2,1.1,0,gap,2.2,.12,piv);b.door=piv;
  b.dw={x0:x-gap/2,x1:x+gap/2,z0:z+d/2-.2,z1:z+d/2+.2,y:y+h};ch.walls.push(b.dw);
  const setDoor=()=>{piv.rotation.y=b.open?-Math.PI/2.1:0;b.dw.off=b.open};setDoor();
  ch.inter.push({x:x,y:y,z:z+d/2+.4,label:()=>b.open?'E · Cerrar puerta':'E · Abrir puerta',use(){b.open=!b.open;setDoor();save(ch,b);toast(b.open?'Puerta abierta':'Puerta cerrada')}});
  // cofre (solo existe si el interior está cargado)
  ch.inter.push({get active(){return!!b.interior},x:x-w/2+1.2,y:y,z:z-d/2+1.2,label:()=>b.crate?'Cofre vacío':'E · Abrir cofre',use(){if(!b.crate){b.crate=true;save(ch,b);addItem('venda',2);addItem('bala',12);toast('Encuentras: 2 vendas y 12 balas')}}})}
const save=(ch,b)=>saved.set(ch.key+'/'+b.i,{open:b.open,crate:b.crate});
// interiores: se crean al acercarse y se descartan al alejarse
function updInterior(ch,b){
  const near=Math.hypot(P.x-b.x,P.z-b.z)<INT_R;
  if(near&&!b.interior){const ig=new THREE.Group();
    box(floorMat,b.x,b.y+.02,b.z,b.w-.6,.1,b.d-.6,ig);
    box(crateMat,b.x-b.w/2+1.2,b.y+.4,b.z-b.d/2+1.2,.9,.8,.9,ig);
    box(crateMat,b.x+b.w/4,b.y+.45,b.z-b.d/4,1.6,.9,.8,ig);
    S.add(ig);b.interior=ig}
  else if(!near&&b.interior){S.remove(b.interior);b.interior=null}}
function unload(ch){S.remove(ch.g);ch.blds.forEach(b=>{if(b.interior){S.remove(b.interior);b.interior=null}});ch.disp.forEach(o=>o.dispose&&o.dispose());chunks.delete(ch.key)}
function streamChunks(){
  const pcx=Math.floor(P.x/CS),pcz=Math.floor(P.z/CS);let built=0;
  for(let r=0;r<=LOAD&&built<2;r++)for(let dx=-r;dx<=r&&built<2;dx++)for(let dz=-r;dz<=r&&built<2;dz++){
    if(Math.max(Math.abs(dx),Math.abs(dz))!==r)continue;const k=(pcx+dx)+','+(pcz+dz);
    if(!chunks.has(k)){buildChunk(pcx+dx,pcz+dz);built++}}
  for(const ch of [...chunks.values()])if(Math.max(Math.abs(ch.cx-pcx),Math.abs(ch.cz-pcz))>UNLOAD)unload(ch)}
// ---------- jugador ----------
const P={x:0,y:0,z:0,vy:0,yaw:0,pitch:0,crouch:false,ground:true,third:false,safe:{x:0,z:0}};
P.z=roadD(0)<4?0:0;P.x=0;P.z=64;P.y=H(P.x,P.z);
const body=new THREE.Group();
const bm=new THREE.MeshLambertMaterial({color:0x6a7a52});
const torso=new THREE.Mesh(new THREE.CylinderGeometry(.3,.35,1.1,8),bm);torso.position.y=.95;
const head=new THREE.Mesh(new THREE.SphereGeometry(.2,8,6),new THREE.MeshLambertMaterial({color:0xc9a98a}));head.position.y=1.65;
const legs=new THREE.Mesh(new THREE.CylinderGeometry(.28,.22,.4,8),new THREE.MeshLambertMaterial({color:0x33382c}));legs.position.y=.2;
body.add(torso,head,legs);S.add(body);
const keys={};let locked=false,drag=false;
const near=()=>{const a=[];const pcx=Math.floor(P.x/CS),pcz=Math.floor(P.z/CS);for(let i=-1;i<=1;i++)for(let j=-1;j<=1;j++){const c=chunks.get((pcx+i)+','+(pcz+j));c&&a.push(c)}return a};
function collide(){
  const r=.4;for(const c of near())for(const w of c.walls){if(w.off||P.y>w.y)continue;
    const cx=clamp(P.x,w.x0,w.x1),cz=clamp(P.z,w.z0,w.z1);let dx=P.x-cx,dz=P.z-cz,d2=dx*dx+dz*dz;
    if(d2<r*r){if(d2>1e-6){const d=Math.sqrt(d2),k=(r-d)/d;P.x+=dx*k;P.z+=dz*k}
      else{const ex=Math.min(P.x-w.x0,w.x1-P.x),ez=Math.min(P.z-w.z0,w.z1-P.z);if(ex<ez)P.x+=(P.x-w.x0<w.x1-P.x?-1:1)*(ex+r);else P.z+=(P.z-w.z0<w.z1-P.z?-1:1)*(ez+r)}}}}
function inWall(x,z,y){for(const c of near())for(const w of c.walls)if(!w.off&&y<w.y&&x>w.x0&&x<w.x1&&z>w.z0&&z<w.z1)return true;return false}
function step(dt){
  const run=keys[BIND.run]||keys.ShiftRight;P.crouch=!!keys[BIND.crouch];
  const sp=P.crouch?1.8:run?6.5:3.6,f=(keys[BIND.fwd]?1:0)-(keys[BIND.back]?1:0),s=(keys[BIND.right]?1:0)-(keys[BIND.left]?1:0),l=Math.hypot(f,s)||1;
  const sy=Math.sin(P.yaw),cy=Math.cos(P.yaw);
  P.x+=(-sy*f+cy*s)/l*sp*dt;P.z+=(-cy*f-sy*s)/l*sp*dt;collide();
  const gy=H(P.x,P.z);
  if(keys[BIND.jump]&&P.ground&&!P.crouch){P.vy=5.2;P.ground=false}
  P.vy-=14*dt;P.y+=P.vy*dt;if(P.y<=gy){P.y=gy;P.vy=0;P.ground=true}
  if(P.ground&&!inWall(P.x,P.z,P.y+.5)){P.safe.x=P.x;P.safe.z=P.z}
  if(Math.abs(P.x)>1e6)P.x=0}
function recover(){P.x=P.safe.x;P.z=P.safe.z+2.5;P.y=H(P.x,P.z)+.5;toast('Posición recuperada')}
function updCam(){
  const eye=P.y+(P.crouch?1.15:1.65),dir=new THREE.Vector3(-Math.sin(P.yaw)*Math.cos(P.pitch),Math.sin(P.pitch),-Math.cos(P.yaw)*Math.cos(P.pitch));
  body.position.set(P.x,P.y,P.z);body.visible=P.third;
  if(!P.third){cam.position.set(P.x,eye,P.z)}
  else{let t=0;const bx=-dir.x,by=-dir.y,bz=-dir.z;for(;t<4;t+=.25){const x=P.x+bx*(t+.3),y=eye+.2+by*(t+.3),z=P.z+bz*(t+.3);if(inWall(x,z,y)||y<H(x,z)+.3)break}
    t=Math.max(.6,t-.25);cam.position.set(P.x+bx*t,Math.max(eye+.2+by*t,H(P.x+bx*t,P.z+bz*t)+.4),P.z+bz*t)}
  cam.lookAt(cam.position.x+(P.third?dir.x:dir.x),cam.position.y+dir.y,cam.position.z+dir.z);
  if(P.third)cam.lookAt(P.x,eye,P.z)}
// ---------- interacción / UI ----------
const $=id=>document.getElementById(id),prm=$('prompt'),tst=$('toast'),stt=$('stats');let cur=null,tt=0;
function toast(t){tst.textContent=t;tst.style.opacity=1;clearTimeout(tt);tt=setTimeout(()=>tst.style.opacity=0,1800)}
function interact(){cur=null;let best=2.8;for(const c of near())for(const it of c.inter){if(it.active===false)continue;const d=Math.hypot(P.x-it.x,P.z-it.z);if(d<best){best=d;cur=it}}
  prm.style.display=cur?'block':'none';cur&&(prm.textContent=cur.label())}
addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space')e.preventDefault();if(state!=='play')return;if(e.code===BIND.use&&cur)cur.use();if(e.code===BIND.cam)P.third=!P.third;if(e.code===BIND.unstuck)recover()});
addEventListener('keyup',e=>keys[e.code]=false);
addEventListener('mousemove',e=>{if(state!=='play'||!(locked||drag))return;P.yaw-=e.movementX*.0025;P.pitch=clamp(P.pitch-e.movementY*.0025,-1.4,1.4)});
R.domElement.addEventListener('mousedown',()=>drag=true);addEventListener('mouseup',()=>drag=false);
// ======== Capa de menú/UI: separada del gameplay; solo usa start/pause/snap ========
const BIND={fwd:'KeyW',back:'KeyS',left:'KeyA',right:'KeyD',run:'ShiftLeft',jump:'Space',crouch:'KeyC',use:'KeyE',cam:'KeyV',unstuck:'KeyR',pause:'Escape'};
const NAMES={fwd:'Avanzar',back:'Retroceder',left:'Izquierda',right:'Derecha',run:'Correr',jump:'Saltar',crouch:'Agacharse',use:'Interactuar',cam:'Cambiar cámara',unstuck:'Recuperarse si quedas atrapado',pause:'Pausa'};
const QP={baja:{res:70,veg:35,dist:2},media:{res:85,veg:70,dist:3},alta:{res:100,veg:100,dist:3},ultra:{res:100,veg:100,dist:4}};
const CFG_DEF={quality:'media',res:85,veg:70,dist:3,fog:true,shadows:false,effects:false,master:80,music:60,sfx:80,amb:70};
const Store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}};
const Saves={mem:null,sum(t){let h=5381;for(let i=0;i<t.length;i++)h=(h*33^t.charCodeAt(i))>>>0;return h},
