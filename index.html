<title>Zombie World Explorer</title>

<style>

:root{--bg:#10140f;--fg:#d9e0cf;--ac:#d9894f;--dim:#8a9484;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

@media (prefers-color-scheme:dark){:root{color-scheme:dark}}

html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,"Times New Roman",serif;overflow:hidden}

canvas{display:block}

#hud{position:fixed;inset:0;pointer-events:none;font-size:14px}

#prompt{position:absolute;left:50%;top:58%;transform:translateX(-50%);padding:6px 12px;background:#0009;border-left:3px solid var(--ac);display:none}

#dot{position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px;background:var(--fg);border-radius:50%;opacity:.6}

#stats{position:absolute;left:12px;bottom:12px;color:var(--dim);font-size:12px;line-height:1.5;white-space:pre}

#toast{position:absolute;left:50%;top:14%;transform:translateX(-50%);opacity:0;transition:opacity .3s}


:root{--dawn:#d9894f;--bone:#e6dfcd;--night:#0f1311;--mist:#8d9585}

[hidden]{display:none!important}

body:not([data-s=play]) #hud{display:none}

#ui{position:fixed;inset:0;z-index:5;animation:in .22s both;transition:opacity .18s}

#ui.out{opacity:0;pointer-events:none}

#ui.dim{background:#0f1311b8}

#bg{position:absolute;inset:0;background:var(--night);overflow:hidden;display:none}

#ui.bgon #bg{display:block}

#bg svg{position:absolute;inset:0;width:100%;height:100%}

#bg::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#0f1311d9,#0f131100 62%),linear-gradient(0deg,#0f1311cc,#0f131100 40%)}

.fog{position:absolute;left:0;width:200%;background-repeat:repeat-x;background-size:50% 100%;animation:drift 90s linear infinite;will-change:transform}

.f1{bottom:16%;height:34%;background-image:radial-gradient(ellipse at 30% 60%,#d8c8aa55,transparent 62%),radial-gradient(ellipse at 80% 40%,#b9c0b044,transparent 55%)}

.f2{bottom:0;height:30%;animation-duration:140s;animation-direction:reverse;background-image:radial-gradient(ellipse at 50% 70%,#8d968a55,transparent 65%)}

@keyframes drift{to{transform:translateX(-50%)}}

@keyframes in{from{opacity:0}}

.main{display:flex;flex-direction:column;justify-content:center;padding:4vh 8vw;gap:4vh}

.btn:hover,.btn:focus-visible{border-color:var(--dawn);background:#e6dfcd14;transform:translateX(8px)}

.btn:focus-visible{outline:2px solid var(--bone)}

.btn:disabled{opacity:.35;cursor:default}

.btn.warn{color:var(--dawn)}

.btn small{display:block;margin-top:6px;font-weight:400;letter-spacing:.04em;text-transform:none;color:var(--mist);font-size:12px}

.main footer{color:var(--mist);font-size:12px;position:absolute;right:20px;bottom:14px}

.panel{width:min(600px,92vw);max-height:88vh;overflow:auto;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);height:auto;padding:26px 30px;background:#0f1311ee;border-left:3px solid var(--dawn)}

.panel h2{margin:0 0 14px;font:800 30px "Bahnschrift","Arial Narrow",Impact,sans-serif;text-transform:uppercase;letter-spacing:.06em}

.tabs button{background:none;border:0;color:var(--mist);padding:8px 14px;font:inherit;cursor:pointer;border-bottom:2px solid transparent}

.tabs .on{color:var(--bone);border-color:var(--dawn)}

.row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:1px solid #e6dfcd14;font-size:15px}

.ctl{display:flex;align-items:center;gap:10px}.ctl input[type=range]{width:170px;accent-color:var(--dawn)}.ctl output{min-width:58px;text-align:right;color:var(--mist)}

.seg button{background:none;border:1px solid #e6dfcd44;color:var(--bone);padding:6px 10px;cursor:pointer;font:inherit;text-transform:capitalize}.seg .on{background:var(--dawn);color:var(--night);border-color:var(--dawn)}

kbd{font:600 13px ui-monospace,monospace;border:1px solid #e6dfcd55;padding:3px 9px}

.note{color:var(--mist);font-size:12px;margin:10px 0 0;line-height:1.5}

.foot{display:flex;justify-content:space-between;margin-top:14px}

.panel .btn{font-size:15px}

.panel.wide{width:min(760px,94vw)}.cards{display:flex;flex-wrap:wrap;gap:12px}

.card{flex:1 1 150px;background:#e6dfcd0d;border:1px solid #e6dfcd33;color:var(--bone);padding:10px;cursor:pointer;text-align:center;font:inherit;display:flex;flex-direction:column;align-items:center;gap:6px}

.card:hover,.card:focus-visible{border-color:var(--dawn)}.card img{width:100%;max-width:130px;height:auto}.card b{font-size:17px;letter-spacing:.08em;text-transform:uppercase}.card small{color:var(--mist);font-size:12px;line-height:1.4}

#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:9;transition:opacity .35s}

#fade.on{opacity:1;pointer-events:all}

#invbtn{position:absolute;right:14px;top:14px;width:48px;height:48px;pointer-events:auto;cursor:pointer;font-size:24px;line-height:1;background:#0f1311cc;color:var(--bone);border:1px solid #e6dfcd55;border-left:3px solid var(--dawn);display:none}

#invbtn::after{content:attr(data-n);position:absolute;right:2px;bottom:1px;font:600 11px system-ui,sans-serif;color:var(--dawn)}body[data-s=play] #invbtn{display:block}

@media (max-width:640px){.panel{padding:16px 14px}.cards.inv .card{flex:0 0 92px}.panel h2{font-size:24px}.btn{padding:10px 12px}#invbtn{width:54px;height:54px}}

.card.on{border-color:var(--dawn);background:#d9894f22}.cards.inv .card{flex:0 0 112px;padding:6px;gap:2px}.cards.inv{max-height:46vh;overflow:auto;margin-bottom:6px}

#pick{position:absolute;right:14px;bottom:70px;display:flex;flex-direction:column;gap:6px;opacity:0;transition:opacity .4s}.pk{display:flex;align-items:center;gap:8px;padding:4px 10px;background:#0009;border-left:3px solid var(--ac)}

#bhud{position:absolute;left:50%;bottom:16%;transform:translateX(-50%);display:none;text-align:center;padding:8px 14px;background:#0009;border-left:3px solid var(--ac);font-size:14px;line-height:1.5;white-space:pre}

#hurt{position:fixed;inset:0;pointer-events:none;z-index:4;opacity:0;transition:opacity .25s;background:radial-gradient(ellipse at center,#0000 38%,#a0141499 100%)}

#zfear{position:fixed;inset:0;pointer-events:none;z-index:3;opacity:0;transition:opacity .35s;

 background:radial-gradient(ellipse at center,rgba(0,0,0,0) 34%,rgba(12,0,0,.12) 58%,rgba(0,0,0,.82) 100%);

 mix-blend-mode:multiply}

#zfear:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.012) 0 1px,transparent 1px 5px);opacity:.55}

.section-title{margin:14px 0 4px;color:var(--dawn);letter-spacing:.08em;text-transform:uppercase;font-size:13px}.story-teaser{margin-top:4px;color:var(--dawn)!important}.upcoming{opacity:.78;cursor:default;position:relative;min-height:245px}.upcoming:hover{border-color:#e6dfcd33}.coming-badge{font-size:10px;letter-spacing:.12em;color:var(--dawn);border:1px solid #e6dfcd33;padding:3px 7px}.future-avatar{width:86px;height:86px;border-radius:50%;display:grid;place-items:center;border:1px dashed #e6dfcd55;color:var(--dawn);font-size:34px;margin:8px auto}.character-card{min-width:160px}

function applyCfg(rebuild){R.setPixelRatio(Math.min(devicePixelRatio,cfg.quality==='ultra'?2:1.5)*cfg.res/100);R.setSize(innerWidth,innerHeight);

  LOAD=cfg.dist;UNLOAD=LOAD+1;TREES=Math.max(1,Math.round(70*cfg.veg/100));cam.far=LOAD*CS+80;cam.updateProjectionMatrix();

const snap=()=>({v:2,seed:SEED,character:P.character,difficulty:P.difficulty,custom:P.custom,stats:{...DEFAULT_STATS,...P.stats},pos:{x:P.x,y:P.y,z:P.z,yaw:P.yaw},saved:[...saved],inv:P.inv,equipped:P.equipped,storyMode:P.storyMode,story:P.story,hp:P.hp,zk:[...Z.kill],bp:[...Bsaved],ct:[...cutTrees],dt:Day.t,t:Date.now()});

const sig=()=>{const x=snap();delete x.t;return JSON.stringify(x)};

const persist=()=>{const ok=Saves.write(snap());lastSig=sig();return ok};


function start(st){clearWorld();setSeed(st.seed);saved.clear();cutTrees.clear();(st.ct||[]).forEach(k=>cutTrees.add(k));Z.kill.clear();(st.zk||[]).forEach(k=>Z.kill.add(k));Bsaved.clear();(st.bp||[]).forEach(([k,v])=>Bsaved.set(k,v));bOff();Day.t=st.dt!=null?st.dt:.3;P.hp=st.hp>0?st.hp:100;P.hurtT=0;P.atk=0;P.acd=0;P.toolAnim=null;P.repairFx=null;P.stats={...DEFAULT_STATS,...(st.stats||{})};P.custom={...P.custom,...(st.custom||{})};

  P.storyMode=!!st.storyMode;P.story={chapter:0,beat:0,started:0,kills:0,baseKills:0,dist:0,seen:[],next:0,...(st.story||{})};zClear();(st.saved||[]).forEach(([k,v])=>saved.set(k,v));

  setChar(st.character);P.difficulty=st.difficulty;P.inv=(st.inv||[]).map(i=>({...i}));P.equipped=st.equipped||null;if(P.equipped&&!P.inv.some(i=>i.id===P.equipped&&i.n>0))P.equipped=null;refreshHeldTool();

  const q=st.pos||{x:0,z:64,yaw:0};P.x=q.x;P.z=q.z;P.yaw=q.yaw||0;P.pitch=0;P.vy=0;P.ground=true;P.third=false;P.y=H(P.x,P.z);P.safe={x:P.x,z:P.z};cur=null;

  applyCfg(false);for(let i=0;i<100;i++)streamChunks();P.y=gnd(P.x,P.z);if(!unstick(P,.45)){P.z=ROAD_Z(P.z)}P.y=gnd(P.x,P.z);updCam();lastSig=sig();t0=performance.now()}

let storyBannerTimer=0;

function storySay(title,text,dur=6500){

  const old=$('storyOverlay');if(old)old.remove();

  const box=h('div',{id:'storyOverlay',class:'story-overlay'},

    h('div',{class:'story-inner'},h('div',{class:'story-kicker'},title),h('div',{class:'story-text'},text),

      h('div',{class:'story-continue'},'Hacé clic o presioná Enter para continuar')));

  ui.append(box);box.onclick=()=>box.remove();clearTimeout(storyBannerTimer);storyBannerTimer=setTimeout(()=>box.remove(),dur);

}

function storyStart(){

  if(!P.storyMode)return;

  const db=storyChapter();if(!db)return;

  P.story.started=P.story.started||Date.now();

  if(!P.story.seen.includes('intro-'+P.character)){P.story.seen.push('intro-'+P.character);storySay(db.title,db.intro,9000)}

}

function storyFlashback(id,parts){

  if(P.story.seen.includes(id))return false;

  P.story.seen.push(id);storySay(parts[0],parts[1]+' '+(parts[2]||''),10000);persist();return true;

}

function storyObjective(){

  if(!P.storyMode)return;

  const db=storyChapter(),c=db.chapters[P.story.chapter];

  if(!c)return;

  const o=$('storyObjective');if(o)o.textContent=c[2];

}

function storyProgress(){

  if(!P.storyMode)return;

  const db=storyChapter(),c=db.chapters[P.story.chapter];if(!c)return;

  const need=220+(P.story.chapter*45);

  const progress=Math.floor(P.story.dist/need)+P.story.kills;

  if(progress>=2){

    const flash=c[3];

    if(flash&&flash.length){const id=P.character+'-'+P.story.chapter;if(storyFlashback(id,flash)){P.story.beat=1;}}

    if(P.story.chapter<db.chapters.length-1){

      P.story.chapter++;P.story.dist=0;P.story.kills=0;P.story.baseKills=Z.kill.size;P.story.beat=0;

      const nc=db.chapters[P.story.chapter];

      setTimeout(()=>{storySay(nc[0],nc[1],8500);storyObjective();persist()},900);

    }else if(!P.story.seen.includes('ending-'+P.character)){

      P.story.seen.push('ending-'+P.character);storySay('FINAL · '+db.title,'La historia de este personaje llega a su decisión final. El mundo sigue abierto, pero vos ya sabés algo que otros todavía desconocen.',12000);persist();

    }

  }

}

function storyTick(dt){

  if(!P.storyMode||state!=='play')return;

  P.story.dist+=(P.mv||0)*dt;

  P.story.kills=Math.max(0,Z.kill.size-(P.story.baseKills||0));

  if(!P.story.started)storyStart();

  if(Math.random()<dt*.025)storyProgress();

}

const ZV={skins:[0x8a9a78,0x9aa58a,0x7d8f78,0xa09a86,0x8d8f7a],civil:{tops:[0x5a4a3a,0x3a4a5a,0x6a3a3a,0x4a5a4a,0x7a7468],bots:[0x2f3036,0x3a3329,0x44483f]},medico:{tops:[0xd8d8d2,0x6aa0a0],bots:[0x4a8f8f,0x5a9a9a]},obrero:{tops:[0xd9802a,0x4a5a6a],bots:[0x3a4a5a,0x4a4034]}},ZW={civil:[.75,.2],medico:[.55,.25],obrero:[.5,.15]};

const ZMAXCH=8,ZATK=3,ZDEAD=5;

// ZAI: ajuste fino de la agresividad sin tocar la lógica. mem=s que persiguen sin ver, lose=× de la visión para abandonar, inv=s de investigación, pack=m de alerta de grupo, sight/hear=multiplicadores base

const ZAI={mem:4.5,lose:2.6,inv:11,pack:14,sight:1.12,hear:1.12};

// ZDAY: cuánto cambia cada parámetro con Day.night (0 día → 1 noche profunda). Para comportamientos por hora de un tipo concreto, basta añadirle un campo y leerlo aquí

const ZDAY={sight:.25,hear:.3,mem:.35,spd:.25,idle:.4,cap:.3,cd:.3};   // plazas por chunk, atacantes simultáneos, cadáveres simultáneos

const Z={list:[],pool:[],kill:new Set(),noise:[],nid:0,t:0,nt:0,na:0,group:new THREE.Group()};S.add(Z.group);

const wr=a=>Math.atan2(Math.sin(a),Math.cos(a)),chunkKey=(x,z)=>Math.floor(x/CS)+','+Math.floor(z/CS);

const ZCAP=()=>Math.round(({baja:10,media:18,alta:26,ultra:34}[cfg.quality]||18)*(fps<38?.5:fps<48?.75:1)*(1+ZDAY.cap*Day.night));

// plazas de aparición deterministas por chunk (el índice es estable, así lo abatido se recuerda)

function genZSlots(ch,rnd){ch.zs=[];const ox=ch.cx*CS,oz=ch.cz*CS,add=(x,z,cf)=>{const n=cf.n[0]+Math.floor(rnd()*(cf.n[1]-cf.n[0]+1));for(let i=0;i<n&&ch.zs.length<ZMAXCH;i++){const a=rnd()*6.28,r=n>1?1.2+rnd()*2.6:0,px=x+Math.cos(a)*r,pz=z+Math.sin(a)*r,sd=Math.floor(rnd()*1e9);

  if(px>ox+1&&px<ox+CS-1&&pz>oz+1&&pz<oz+CS-1&&!ch.blds.some(b=>Math.abs(px-b.x)<b.w/2+1&&Math.abs(pz-b.z)<b.d/2+1))ch.zs.push({x:px,z:pz,role:cf.role,dg:cf.dg,idx:ch.zs.length,sd})}};

 const cf=ch.blds.length?ZCFG.campoConEdificios:ZCFG.campo;if(rnd()<cf.p)add(ox+4+rnd()*56,oz+4+rnd()*56,cf)}

function makeZ(){const root=new THREE.Group(),bp=new THREE.Group(),tor=new THREE.Group(),

R={root,bp,tor,hips:{},arms:{},legs:{},armm:{},face:{},rags:{}},

root.add(bp);bp.add(tor);tor.position.y=.96;

R.torso=mesh(CYL,tor);R.head=mesh(SPH,tor);R.acc=mesh(BOX,tor);R.wound=mesh(BOX,tor);

R.neck=mesh(CYL,tor);

R.face.eyeL=mesh(SPH,tor);R.face.eyeR=mesh(SPH,tor);

R.face.pupilL=mesh(SPH,tor);R.face.pupilR=mesh(SPH,tor);

R.face.mouth=mesh(BOX,tor);R.face.jaw=mesh(BOX,tor);

R.rags.L=mesh(BOX,tor);R.rags.R=mesh(BOX,tor);

[-1,1].forEach((s,i)=>{const n=i?'R':'L',hip=new THREE.Group(),sh=new THREE.Group();

hip.position.set(s*.1,.96,0);bp.add(hip);R.legs[n]=mesh(CYL,hip);

sh.position.set(s*.27,.5,0);tor.add(sh);R.armm[n]=mesh(CYL,sh);R.hips[n]=hip;R.arms[n]=sh});

// apariencia: piel, ropa, accesorio, herida, proporciones, postura y cojera salen de la semilla de cada plaza (no hay dos iguales)

function zApply(z){const r=z.rig,v=z.v,set=(m,mat,sc,p)=>{m.material=mat;m.scale.set(...sc);m.position.set(...p)};

set(r.head,M(v.skin),[.115*v.bw,.14*v.headDepth,.125*v.bw],[0,.76,0]);r.head.rotation.z=v.tilt;

set(r.neck,M(v.skin),[.055,.16,.055],[0,.64,0]);

const eyeMat=M(v.eye), darkMat=M(v.pupil), mouthMat=M(v.mouth), jawMat=M(v.skin);

set(r.face.eyeL,eyeMat,[.025,.028,.018],[-.045,.775,-.115]);

set(r.face.eyeR,eyeMat,[.025,.028,.018],[.045,.775,-.115]);

set(r.face.pupilL,darkMat,[.010,.014,.008],[-.045,.775,-.131]);

set(r.face.pupilR,darkMat,[.010,.014,.008],[.045,.775,-.131]);

set(r.face.mouth,mouthMat,[.065,.026,.012],[0,.695,-.125]);

set(r.face.jaw,jawMat,[.075,.035,.045],[0,.675,-.10]);

r.face.eyeL.visible=r.face.eyeR.visible=v.face;

r.face.pupilL.visible=r.face.pupilR.visible=v.face;

r.face.mouth.visible=v.face;

r.face.jaw.visible=v.face;

r.face.eyeL.rotation.z=v.eyeTilt;r.face.eyeR.rotation.z=-v.eyeTilt;


 for(const n of['L','R']){set(r.legs[n],M(v.bot),[.075,.9,.075],[0,-.45,0]);set(r.armm[n],M(v.top),[.055,.62,.055],[0,-.31,0])}

 r.acc.visible=v.acc!=='none';if(v.acc==='vest')set(r.acc,M(0xd9802a),[.43*v.bw,.36,.29*v.bw],[0,.28,0]);else if(v.acc==='coat')set(r.acc,M(0xe0e0da),[.45*v.bw,.8,.3*v.bw],[0,.05,0]);else if(v.acc==='hair')set(r.acc,M(v.hair),[.2,.07,.22],[0,.86,0]);

 r.rags.L.visible=v.rag; r.rags.R.visible=v.rag;

set(r.rags.L,M(v.topDark),[.075,.16,.012],[-.13,.08,-.14]);

set(r.rags.R,M(v.topDark),[.075,.20,.012],[.13,.00,-.14]);

r.rags.L.rotation.z=v.ragRot;r.rags.R.rotation.z=-v.ragRot;

r.wound.visible=v.wound;set(r.wound,M(0x6a1b1b),[.15,.13,.05],[v.ws*.1,.35,-.14])}

function zSpawn(c,s){const r=rngOf(s.sd,13),R=()=>r(),w=R(),W=ZW[s.role],tn=w<W[0]?'caminante':w<W[0]+W[1]?'corredor':'bruto',ty=ZT[tn],pal=ZV[s.role],pk=a=>a[Math.floor(R()*a.length)],dg=s.dg||1;

 const v={skin:pk(ZV.skins),top:pk(pal.tops),bot:pk(pal.bots),hair:pk([0x2a2420,0x4a3a2a,0x8a8478,0x1a1a1a]),

acc:s.role==='medico'?(R()<.7?'coat':'none'):s.role==='obrero'?(R()<.7?'vest':'none'):pk(['hair','hair','none']),

eye:pk([0xb7b49b,0x8f988c,0xd0c8a0]),pupil:0x090909,mouth:pk([0x17120f,0x241713]),

topDark:0x171817,face:R()>.10,eyeTilt:(R()-.5)*.18,headDepth:.95+R()*.12,

 if(tn==='bruto'){v.bw*=1.25;v.wd*=1.1}

 const z={ty,tn,v,slot:s,ck:c.key,x:s.x,z:s.z,y:gndZ(s.x,s.z),hx:s.x,hz:s.z,yaw:R()*6.28,hp:ty.hp,state:'IDLE',st:1+R()*2,t:0,acc:R()*.3,pt:R()*.15,cd:0,sm:(.85+R()*.3)*dg,hm:(.8+R()*.4)*dg,react:.8+R()*.5,tx:s.x,tz:s.z,lx:s.x,lz:s.z,seen:0,blk:0,det:R()<.5?-1:1,detT:0,stuck:0,ph:R()*6,mvSp:0,cs:0,dtot:0,lt:0,flank:(R()-.5)*1.9,agg:.8+R()*.45,twj:0,see:false,hn:0,snd:3+R()*8,fall:R()<.5?1:-1,ttl:26,a2:0,phase:0,ph2:0,inv:false,d:99,heavy:false};

 z.rig=Z.pool.pop()||makeZ();Z.group.add(z.rig.root);z.rig.root.visible=true;zApply(z);s.on=true;Z.list.push(z);if(R()<.7)zGo(z,'WANDER');return z}

function zFree(i){const z=Z.list[i];if(z.state==='ATTACK')Z.na--;z.slot.on=false;if(z.rig){z.rig.root.visible=false;Z.group.remove(z.rig.root);Z.pool.push(z.rig);z.rig=null}Z.list.splice(i,1)}

function zClear(){for(let i=Z.list.length-1;i>=0;i--)zFree(i);Z.noise.length=0;Z.na=0}

// activación: anillo de 38–85 m, nunca delante del jugador cerca, nunca dentro de objetos ni encima de otro zombi; tope según calidad/FPS; cadáveres limitados

function zManage(){const L=Z.list,cap=ZCAP(),dead=L.filter(z=>z.state==='DEAD');if(dead.length>ZDEAD){dead.sort((a,b)=>b.t-a.t);for(const z of dead.slice(0,dead.length-ZDEAD))z.ttl=Math.min(z.ttl,z.t)}

 for(let i=L.length-1;i>=0;i--){const z=L[i];if(!chunks.has(chunkKey(z.x,z.z))||Math.hypot(z.x-P.x,z.z-P.z)>115||(z.state==='DEAD'&&z.t>=z.ttl))zFree(i)}

 if(L.length>=cap)return;const fx=-Math.sin(P.yaw),fz=-Math.cos(P.yaw);let n=0;

 for(const c of chunks.values()){if(!c.zs||Math.hypot(c.cx*CS+32-P.x,c.cz*CS+32-P.z)>130)continue;

  for(const s of c.zs){if(s.on||s.bad||Z.kill.has(c.key+'/'+s.idx))continue;const dx=s.x-P.x,dz=s.z-P.z,d=Math.hypot(dx,dz);if(d<38||d>85||((dx*fx+dz*fz)/d>.5&&d<62))continue;

   if(blockedAt(s.x,s.z,.5,gndZ(s.x,s.z))||zFoot(s.x,s.z)){s.bad=true;continue}if(L.some(o=>Math.hypot(o.x-s.x,o.z-s.z)<1.1))continue;zSpawn(c,s);if(L.length>=cap||++n>=2)return}}}

// suelo para zombis: un solo chunk (los edificios nunca cruzan chunks), mucho más barato que gnd()

function gndZ(x,z){const c=chunks.get(chunkKey(x,z));if(c)for(const b of c.blds)if(Math.abs(x-b.x)<b.w/2-.15&&Math.abs(z-b.z)<b.d/2-.15)return b.y+.06;return floorY(x,z)}

// línea de visión: intersección exacta del segmento con cajas (muros, coches) y círculos (troncos, postes); no se "cuela" por paredes finas

function losClear(x0,z0,x1,z1,ignore=null){const ey=gndZ(x0,z0)+1.5,dx=x1-x0,dz=z1-z0,mx=Math.min(x0,x1)-1,Mx=Math.max(x0,x1)+1,mz=Math.min(z0,z1)-1,Mz=Math.max(z0,z1)+1,l2=dx*dx+dz*dz||1;

 for(let a=Math.floor(mx/CS);a<=Math.floor(Mx/CS);a++)for(let b=Math.floor(mz/CS);b<=Math.floor(Mz/CS);b++){const c=chunks.get(a+','+b);if(!c)continue;

  for(const w of c.walls){if(w.off||ey>=w.y||w.x1<mx||w.x0>Mx||w.z1<mz||w.z0>Mz)continue;let t0=0,t1=1;

   if(Math.abs(dx)<1e-9){if(x0<w.x0||x0>w.x1)continue}else{let ta=(w.x0-x0)/dx,tb=(w.x1-x0)/dx;if(ta>tb){const q=ta;ta=tb;tb=q}t0=Math.max(t0,ta);t1=Math.min(t1,tb)}

   if(Math.abs(dz)<1e-9){if(z0<w.z0||z0>w.z1)continue}else{let ta=(w.z0-z0)/dz,tb=(w.z1-z0)/dz;if(ta>tb){const q=ta;ta=tb;tb=q}t0=Math.max(t0,ta);t1=Math.min(t1,tb)}

   if(t0<=t1)return false}

  for(const L of c.cg.values())for(const o of L){if(o===ignore)continue;if(ey>=o.y||o.x<mx||o.x>Mx||o.z<mz||o.z>Mz)continue;const t=clamp(((o.x-x0)*dx+(o.z-z0)*dz)/l2,0,1),ex=x0+dx*t-o.x,ez=z0+dz*t-o.z;if(ex*ex+ez*ez<o.r*o.r)return false}}

 return true}

// detección: distancia, campo de visión, línea de visión y movimiento del jugador (agachado/quieto = más difícil de ver, corriendo = más fácil)

function zSee(z,d){if(P.hp<=0)return false;const rg=z.ty.sight*z.sm*ZAI.sight*(1-ZDAY.sight*Day.night)*(P.crouch?.55:P.mv>5?1.25:P.mv>0?1:.8);if(d>rg)return false;if(d>3&&Math.abs(wr(Math.atan2(-(P.x-z.x),-(P.z-z.z))-z.yaw))>z.ty.fov/2)return false;return losClear(z.x,z.z,P.x,P.z)}

// bus de ruido (arquitectura para sonidos): cualquier sistema futuro (disparos, objetos, eventos) llama zNoise(x,z,radio) y los zombis cercanos investigan

function zNoise(x,z,r,src){Z.noise.push({x,z,r,t:Z.t,id:++Z.nid,src});if(Z.noise.length>8)Z.noise.shift()}

function zHear(z){const s0=z.state;if(s0!=='IDLE'&&s0!=='WANDER'&&s0!=='RETURN'&&s0!=='INVESTIGATE')return;

 for(const e of Z.noise){if(e.id<=z.hn||Z.t-e.t>.8||e.src===z)continue;const rr=e.r*z.hm*z.ty.hear*ZAI.hear*(1+ZDAY.hear*Day.night),d=Math.hypot(e.x-z.x,e.z-z.z);if(d>rr)continue;z.hn=e.id;if(d>rr*(losClear(z.x,z.z,e.x,e.z)?1:.55))continue;

  z.lx=e.x+(Math.random()-.5)*4;z.lz=e.z+(Math.random()-.5)*4;z.inv=true;zGo(z,'ALERT');return}}

// sin interior cargado, los edificios son macizos para los zombis (no atraviesan paredes ni muebles que no existen)

function zFoot(x,z){const c=chunks.get(chunkKey(x,z));if(!c)return true;for(const b of c.blds)if(!b.interior&&Math.abs(x-b.x)<b.w/2+.1&&Math.abs(z-b.z)<b.d/2+.1)return true;return false}

// movimiento: aceleración progresiva, subpasos de ≤.35 m (no atraviesan paredes finas ni con pasos largos) y rodeo hacia el lado libre cuando se atascan

function zMove(z,tx,tz,sp,dt){let dx=tx-z.x,dz=tz-z.z;const d=Math.hypot(dx,dz);if(d<.05)return 0;dx/=d;dz/=d;z.cs+=(sp-z.cs)*Math.min(1,dt*3.5);

 const bump=()=>{z.blk+=dt;if(z.blk>.3&&z.detT<=0){const fr=q=>{const x=z.x-dz*q*2.2+dx,y=z.z+dx*q*2.2+dz;return!blockedAt(x,y,.4,gndZ(x,y))&&!zFoot(x,y)},l=fr(1),r=fr(-1);z.det=l&&!r?1:r&&!l?-1:(Math.random()<.5?-1:1);z.detT=1.2;z.blk=0;z.stuck++}};

 if(z.detT<=0)z.dtot=0;

 if(z.detT>0){z.detT-=dt;z.dtot+=dt;if((z.lt-=dt)<=0){z.lt=.25;if(losClear(z.x,z.z,tx,tz))z.detT=0;else if(z.dtot<8)z.detT=Math.max(z.detT,.4)}const c=Math.cos(z.det*1.1),s=Math.sin(z.det*1.1),o=dx;dx=dx*c-dz*s;dz=o*s+dz*c}

 const want=Math.min(z.cs*dt,d),n=Math.max(1,Math.ceil(want/.35)),sw=want/n;let mv=0;

 for(let k=0;k<n;k++){const nx=z.x+dx*sw,nz=z.z+dz*sw,dp=Math.hypot(nx-P.x,nz-P.z);if(dp<.95&&dp<Math.hypot(z.x-P.x,z.z-P.z))break;if(zFoot(nx,nz)&&!zFoot(z.x,z.z)){bump();break}

  const o={x:z.x,z:z.z,y:z.y};moveEntity(o,dx*sw,dz*sw,.35);const m=Math.hypot(o.x-z.x,o.z-z.z);z.x=o.x;z.z=o.z;mv+=m;if(m<sw*.3){bump();break}}

// separación entre zombis (evita fusiones y masas imposibles)

function zSep(z){for(const q of Z.list){if(q===z||q.state==='DEAD')continue;const dx=z.x-q.x,dz=z.z-q.z,d=Math.hypot(dx,dz);if(d<.9){const k=(.9-d)*.5/(d||.1),o={x:z.x,z:z.z,y:z.y};moveEntity(o,(dx||Math.random()-.5)*k,(dz||Math.random()-.5)*k,.35);if(Math.hypot(o.x-P.x,o.z-P.z)>=.95){z.x=o.x;z.z=o.z}}}}

// alerta de manada: los zombis pasivos cercanos a uno que ataca, ve o recibe un golpe investigan la zona del jugador (no su posición exacta)

function zAlertNear(z){for(const q of Z.list){if(q===z||q.state==='DEAD')continue;const s0=q.state;if(s0!=='IDLE'&&s0!=='WANDER'&&s0!=='RETURN')continue;if(Math.hypot(q.x-z.x,q.z-z.z)<ZAI.pack*q.hm){q.lx=P.x+(Math.random()-.5)*5;q.lz=P.z+(Math.random()-.5)*5;q.inv=true;zGo(q,'ALERT')}}}

function zGo(z,st0){if(z.state==='ATTACK')Z.na--;z.state=st0;z.t=0;z.blk=0;z.stuck=0;

 if(st0==='IDLE')z.st=(1.5+Math.random()*3.5)*(1-ZDAY.idle*Day.night);

 else if(st0==='WANDER'){for(let k=0;k<5;k++){const a=Math.random()*6.28,r=5+Math.random()*14,x=z.hx+Math.cos(a)*r,q=z.hz+Math.sin(a)*r;if(!zFoot(x,q)&&!blockedAt(x,q,.4,gndZ(x,q))){z.tx=x;z.tz=q;break}}z.st=14}

 else if(st0==='ALERT')z.st=(.25+Math.random()*.4)*z.react/z.agg;else if(st0==='INVESTIGATE'){z.st=ZAI.inv;z.ph2=0}else if(st0==='RETURN')z.st=25;else if(st0==='CHASE')z.seen=0;else if(st0==='ATTACK'){z.phase=0;z.a2=0;z.twj=z.ty.tw*(.9+Math.random()*.25);Z.na++}}

// IDLE → WANDER → ALERT → CHASE → ATTACK → SEARCH → RETURN → WANDER (+ HIT, DEAD). A >90 m solo pasean (sin percepción)

function zThink(z,dt){z.t+=dt;z.st-=dt;z.cd-=dt;z.pt-=dt;z.snd-=dt;const ty=z.ty,s0=z.state,dx=P.x-z.x,dz=P.z-z.z,d=z.d=Math.hypot(dx,dz);z.mvSp=0;if(s0==='DEAD')return;

 if(d>90){if(s0!=='IDLE'&&s0!=='WANDER'&&s0!=='RETURN'){zGo(z,'RETURN')}}

 else{if(d<45)zSep(z);if(z.pt<=0){z.pt=.12+Math.random()*.08;z.see=zSee(z,d);zHear(z)}}

 const see=d<=90&&z.see,st1=z.state;

 if(see&&st1==='INVESTIGATE'){z.lx=P.x;z.lz=P.z;zGo(z,'CHASE');Snd.zs('persecucion',z.x,z.z,false);zNoise(z.x,z.z,10,z);zAlertNear(z)}   // ve al jugador investigando: persecución inmediata

 else if(see&&(st1==='IDLE'||st1==='WANDER'||st1==='RETURN')){z.lx=P.x;z.lz=P.z;z.inv=false;zGo(z,'ALERT');Snd.zs('alerta',z.x,z.z,false)}

 const mvf=(x,q,sp)=>{z.mvSp=zMove(z,x,q,sp,dt)/Math.max(dt,.001)};

/* ===== ZWE ZOMBIE AI — SAFE GROUP BEHAVIOR ===== */

const ZHorrorAI={

  sep:1.35,

  attackRange:1.42,

  attackers:2,

  flank:1.15

};


function zAIGroup(dt){

  const alive=Z.list.filter(z=>z.state!=='DEAD');

  for(const z of alive){

    z._zai=z._zai||{

      side:Math.random()<.5?-1:1,

      seed:Math.random()*1000,

      attackTimer:0

    };

    const a=z._zai;

    a.attackTimer=Math.max(0,a.attackTimer-dt);


    const dx=P.x-z.x,dz=P.z-z.z,d=Math.hypot(dx,dz)||.001;

    const nx=dx/d,nz=dz/d;


    // Separation force: prevents the classic zombie pile-up.

    let sx=0,sz=0;

    for(const q of alive){

      if(q===z)continue;

      const qx=z.x-q.x,qz=z.z-q.z,qd=Math.hypot(qx,qz);

      if(qd>0 && qd<ZHorrorAI.sep){

        const f=(ZHorrorAI.sep-qd)/ZHorrorAI.sep;

        sx+=(qx/qd)*f;

        sz+=(qz/qd)*f;

      }

    }


    // Count zombies already occupying the attack zone.

    let front=0;

    for(const q of alive){

      if(q===z)continue;

      const qd=Math.hypot(P.x-q.x,P.z-q.z);

      if(qd<ZHorrorAI.attackRange+.3 && q._zai?.attacking)front++;

    }


    const canAttack=d<ZHorrorAI.attackRange && front<ZHorrorAI.attackers;

    a.attacking=canAttack;


    if(canAttack){

      z._zaiGoalX=P.x;

      z._zaiGoalZ=P.z;

      if(a.attackTimer<=0){

        a.attackTimer=.75+(a.seed%0.55);

        z._zaiAttackPulse=.22;

      }

    }else{

      // Lateral approach point. Different zombies choose opposite sides.

      const tx=-nz*a.side;

      const tz= nx*a.side;

      const orbit=Math.min(ZHorrorAI.flank,Math.max(.3,d*.14));


      let gx=P.x+nx*Math.max(0,d-1.5)+tx*orbit;

      let gz=P.z+nz*Math.max(0,d-1.5)+tz*orbit;


      gx+=sx*1.8;

      gz+=sz*1.8;


      z._zaiGoalX=gx;

      z._zaiGoalZ=gz;

    }

  }

}

<rect y="575" width="1600" height="325" fill="#1b221f"/><path d="${mid}" fill="#232b28"/>

<path d="M1280 610V530l30-6v-30l40 10v26l50-8v-40l36 14v94zM240 620V550l24-4v-22l50 8v30l30 4v54z" fill="#2a3230"/>

<path d="M1092 575h16l470 325H560z" fill="#151918"/><path d="M1100 580L1060 900" stroke="#8d8a76" stroke-width="5" stroke-dasharray="16 26" opacity=".5"/>

<script id="zwe-interaction-system-js">

(function(){

'use strict';

const ZI={open:null,doors:new WeakMap()};

function el(id){return document.getElementById(id)}

function typeOf(o){

 const n=String(o?.userData?.name||o?.userData?.type||o?.name||o?.userData?.interactionType||'');

 if(/cofre|chest|crate|caja/i.test(n))return'chest';

 if(/estante|shelf|rack/i.test(n))return'shelf';

 if(/mesa|workbench|craft|banco/i.test(n))return'bench';

 if(/puerta|door|gate/i.test(n))return'door';

 return null;

}

function items(o){

 if(Array.isArray(o?.userData?.loot))return o.userData.loot;

 const t=typeOf(o);

 if(t==='chest')return[

  {id:'wood',name:'Madera',qty:Math.floor(2+Math.random()*4)},

  {id:'scrap',name:'Chatarra',qty:1},{id:'bandage',name:'Vendaje',qty:1}];

 if(t==='shelf')return[

  {id:'wood',name:'Madera',qty:1},{id:'scrap',name:'Chatarra',qty:2},

  {id:'tool_part',name:'Pieza útil',qty:1}];

 return[];

}

function addItem(id,qty){

 if(typeof window.addItem==='function')return window.addItem(id,qty);

 if(typeof window.giveItem==='function')return window.giveItem(id,qty);

 if(window.P&&P.inv)P.inv[id]=(P.inv[id]||0)+qty;

}

function openContainer(o){

 ZI.open=o;el('zweContainerTitle').textContent=typeOf(o)==='shelf'?'Estante':'Cofre';

 const grid=el('zweLootGrid');grid.innerHTML='';

 for(const raw of items(o)){

  const it=typeof raw==='string'?{id:raw,name:raw,qty:1}:raw;

  const c=document.createElement('div');c.className='zweLoot';

  c.innerHTML='<strong>'+String(it.name).replace(/[<>&]/g,'')+'</strong><span>Cantidad: '+it.qty+'</span>';

  const b=document.createElement('button');b.textContent='AGARRAR';

  b.onclick=()=>{addItem(it.id,it.qty);c.remove()};c.appendChild(b);grid.appendChild(c);

 }

 el('zweContainerUI').style.display='grid';

}

function closeContainer(){ZI.open=null;el('zweContainerUI').style.display='none'}

function toggleDoor(o){

 const open=!!ZI.doors.get(o);ZI.doors.set(o,!open);

 o.traverse(m=>{if(m.isMesh){if(!m.userData.zweBaseRot)m.userData.zweBaseRot=m.rotation.y;m.rotation.y=m.userData.zweBaseRot+(open?0:-Math.PI/2)}})

}

function interact(o){

 const t=typeOf(o);

 if(t==='door')return toggleDoor(o);

 if(t==='chest'||t==='shelf')return openContainer(o);

 if(t==='bench'){

  if(typeof window.openCrafting==='function')return window.openCrafting(o);

  if(typeof window.showCrafting==='function')return window.showCrafting(o);

  window.dispatchEvent(new CustomEvent('zwe:openWorkbench',{detail:o}));

 }

}

function nearest(){

 if(!window.THREE||!window.P||!window.scene)return null;

 let best=null,bd=3.1;

 scene.traverse(o=>{

  if(!o.visible||!o.userData||!typeOf(o))return;

  const p=new THREE.Vector3();o.getWorldPosition(p);

  const d=Math.hypot(p.x-P.x,p.z-P.z);if(d<bd){bd=d;best=o}

 });

 return best;

}

window.ZWEInteraction={interact,openContainer,closeContainer};

window.ZWERegisterInteractive=function(o,type,opts){

 if(!o)return o;o.userData=o.userData||{};o.userData.interactionType=type;Object.assign(o.userData,opts||{});return o;

};

window.addEventListener('keydown',e=>{

 if(e.key==='Escape'&&ZI.open){closeContainer();return}

 if(e.key.toLowerCase()==='e'&&!e.repeat&&!ZI.open){const o=nearest();if(o)interact(o)}

});

})();

</script>
